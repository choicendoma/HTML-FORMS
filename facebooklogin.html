<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook Login</title>
    <link rel="icon" type="image/png" href="./IMAGES/communication.png" />
  </head>
  <body>
    <form>
      <h2>Log In To Facebook</h2>

      <input
        type="email"
        placeholder="Email address or mobile number"
        style="padding: 10px"
        width="500px"
      />

      <br />
      <br />
      <input
        type="password"
        placeholder="password"
        style="padding: 10px"
        width="500px"
      />
      <br />
      <br />
      <button style="background-color: blue">Login In</button>
      <br />
      <br />
      <button style="background-color: antiquewhite">
        Forgotten password?
      </button>
      <br />
      <br />

      <button>Creat new account</button>
      <br />
      <img src="./IMAGES/meta-logo.png" width="90px" height="90px" />

    </form>
  </body>
</html>
